[project]
name = "datapilot"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb==1.1.3",
    "sqlglot==25.32.1",
    "pydantic==2.10.3",
    "pandas==2.2.3",
    "matplotlib==3.9.2",
    "anthropic>=0.40",
    "openai>=1.55",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "google-auth>=2.36",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest==8.3.4", "ruff==0.8.4", "mypy==1.13.0", "pandas-stubs==2.2.3.241126"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S608"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers =["docker: needs Docker and the sandbox image"]
